<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Profil - Domis</title>
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <header class="p-5 lg:px-40 flex justify-between items-center bg-white shadow-sm">
        <h1 class="text-3xl font-black"><a href="index.html">Domis<span class="text-blue-500">.</span></a></h1>
        <a href="index.html" class="text-gray-600">
            <ion-icon name="arrow-back" class="text-2xl font-bold"></ion-icon>
        </a>
    </header>

    <main class="p-10 lg:px-40">
        <div class="bg-white p-8 rounded-3xl max-w-2xl mx-auto shadow-sm mb-10 border">
            <div class="flex items-start justify-between mb-6">
                <div class="flex items-center gap-6">
                    <img src="" class="w-24 h-24 rounded-full object-cover bg-gray-200" id="profilePic">
                    <div>
                        <h2 class="text-2xl font-bold" id="displayName">Nom Utilisateur</h2>
                        <p class="text-gray-500 text-sm">Date de naissance: <span id="displayBirth">--</span></p>
                    </div>
                </div>
                <button id="openEditModalBtn" class="text-blue-500">
                    <ion-icon name="create-outline" class="text-2xl"></ion-icon>
                </button>
            </div>
            <div class="space-y-3 text-gray-700">
                <p>Date inscription: <span id="regDate" class="font-medium text-black">--</span></p>
                <p>Ville/Pays: <span id="displayLocation" class="font-medium text-black">--</span></p>
                <p>E-mail: <span id="displayEmail" class="font-medium text-black">--</span></p>
                <p>Téléphone: <span id="displayPhone" class="font-medium text-black">--</span></p>
            </div>
        </div>

        <div class="bg-white p-10 rounded-3xl max-w-4xl mx-auto shadow-lg">
            <h2 class="text-2xl font-bold mb-5">Mes Annonces</h2>
            <div id="myAdsContainer" class="flex flex-col gap-4">
                <!-- Annonces chargées ici -->
            </div>
        </div>
    </main>

    <!-- Modale Modification Profil -->
    <div id="profileModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl w-full max-w-md">
            <h2 class="text-2xl font-bold mb-5">Modifier Profil</h2>
            <input type="text" id="editName" placeholder="Nom complet" class="w-full p-3 border rounded-lg mb-3">
            <input type="text" id="editLocation" placeholder="Ville, Pays" class="w-full p-3 border rounded-lg mb-3">
            <input type="text" id="editPhone" placeholder="Téléphone" class="w-full p-3 border rounded-lg mb-3">
            <input type="date" id="editBirth" class="w-full p-3 border rounded-lg mb-3">
            <label class="block mb-2 text-sm font-bold text-gray-700">Photo de profil</label>
            <input type="file" id="editAvatar" accept="image/*" class="w-full p-3 border rounded-lg mb-3">
            <button id="saveProfileBtn" class="w-full bg-blue-500 text-white font-bold p-3 rounded-lg">Enregistrer</button>
            <button onclick="document.getElementById('profileModal').classList.add('hidden')" class="mt-3 w-full text-gray-500">Fermer</button>
        </div>
    </div>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script type="module" src="profile.js"></script>
</body>
</html>
