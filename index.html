<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domis</title>
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>
    <header class="p-5 lg:px-40 flex flex-col sm:flex-row justify-between items-center gap-4">
        <h1 class="text-3xl font-black">Domis<span class="text-blue-500">.</span></h1>
        <div class="flex gap-3" id="authContainer">
            <button class="p-2 px-6 font-bold rounded-xl" id="inscription">
                Inscription
            </button>
            <button class="p-2 px-6 bg-blue-400 text-white font-bold rounded-xl" id="connexion">
                Connexion
            </button>
        </div>
    </header>
    <section id="blurElement">
        <section class="hidden px-20 lg:px-40 pt-15 py-10 w-2/3 lg:block">
            <h1 class="font-bold text-5xl">🏡Trouvez votre appartement idéal en quelques clics!</h1>
        </section>
        <section class="z-40 sticky top-0 bg-white bg-opacity-80 backdrop-filter backdrop-blur-lg w-full py-7 mt-4 px-10 lg:px-40">
            <div class="relative">
                <div class=" w-full bg-blue-100 flex justify-between items-center rounded-full px-7 py-5 gap-2">
                    <input type="text" placeholder="Recherche" class="w-full bg-transparent focus:outline-none focus:border-none" id="searchBar">
                    <ion-icon name="search" class="text-3xl"></ion-icon>
                </div>
                <div class="hidden absolute z-40 bg-blue-100 top-20 w-full p-10 rounded-2xl" id="searchTab">
                    <div class="flex justify-between items-center border-b-2 border-gray-400 pb-3">
                        <h1 class="font-bold text-lg">Resultat</h1>
                        <button class="text-3xl" id="closeBtn">&times;</button>
                    </div>
                    <div class="flex justify-between items-center p-3 mt-2 hover:bg-blue-50 rounded-lg" id="result">
                        <h2 class="font-medium text-xl">Text</h2>
                        <ion-icon name="arrow-forward-outline" class="text-xl"></ion-icon>
                    </div>
                </div>
            </div>
            
            <div class="my-5 mb-0 w-full flex flex-col sm:flex-row justify-between gap-4">
                <button id="filterBtn" class="lg:hidden w-full bg-gray-200 rounded-lg px-3 py-2 font-bold text-black">Filtrer</button>
                <select name="" id="Filter" class="hidden lg:block bg-blue-400 rounded-lg px-3 py-2 font-bold text-white">
                    <option value="">Filter</option>
                    <option value="">Cartier</option>
                </select>
                <!-- Autres selects cachés en mobile ou gérés dans le tiroir -->
                <button id="addPostBtn" class="w-full lg:w-auto flex items-center justify-center gap-2 bg-blue-400 rounded-lg px-3 py-2 font-bold text-white">Ajouter<ion-icon name="add-circle"></ion-icon></button>
            </div>
        </section>
        <section class="w-full px-5 py-5 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5" id="cards">
        </section>
    </section>

    <!-- Modale Authentification -->
    <div id="authModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white p-6 sm:p-10 rounded-3xl w-full max-w-sm">
            <h2 class="text-2xl font-bold mb-5" id="authTitle">Connexion</h2>
            <input type="email" id="email" placeholder="Email" class="w-full p-3 border rounded-lg mb-3">
            <input type="password" id="password" placeholder="Mot de passe" class="w-full p-3 border rounded-lg mb-5">
            <button id="authBtn" class="w-full bg-blue-400 text-white font-bold p-3 rounded-lg">Valider</button>
            <p class="text-center mt-3 cursor-pointer text-blue-500" id="toggleAuth">Pas encore de compte ? S'inscrire</p>
            <button onclick="document.getElementById('authModal').classList.add('hidden'); document.body.style.overflow='auto'" class="mt-3 w-full text-gray-500">Fermer</button>
        </div>
    </div>

    <!-- Modale Création Annonce -->
    <div id="postModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white p-6 sm:p-10 rounded-3xl w-full max-w-md max-h-[90vh] overflow-y-auto">
            <h2 class="text-2xl font-bold mb-5">Nouvelle Annonce</h2>
            <input type="text" id="postTitle" placeholder="Titre" class="w-full p-3 border rounded-lg mb-3">
            <input type="number" id="postPrice" placeholder="Loyer (Ar)" class="w-full p-3 border rounded-lg mb-3">
            <input type="text" id="postLocation" placeholder="Quartier" class="w-full p-3 border rounded-lg mb-3">
            <div class="flex gap-2 mb-3">
                <input type="text" id="postSize" placeholder="Taille (m²)" class="w-1/2 p-3 border rounded-lg">
                <input type="number" id="postRooms" placeholder="Salles" class="w-1/2 p-3 border rounded-lg">
            </div>
            <label class="block mb-2 text-sm font-bold text-gray-700">Image principale</label>
            <input type="file" id="postImage" accept="image/*" class="w-full p-3 border rounded-lg mb-3">
            <button id="submitPostBtn" class="w-full bg-blue-400 text-white font-bold p-3 rounded-lg">Publier</button>
            <button onclick="document.getElementById('postModal').classList.add('hidden'); document.body.style.overflow='auto'" class="mt-3 w-full text-gray-500">Fermer</button>
        </div>
    </div>

    <!-- Modale Profil -->
    <div id="profileModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
        <div class="bg-white p-10 rounded-3xl w-1/3 relative">
            <h2 class="text-2xl font-bold mb-5">Mon Profil</h2>
            <div class="flex flex-col gap-4">
                <div class="flex items-center justify-between">
                    <img src="https://via.placeholder.com/100" class="w-20 h-20 rounded-full" id="profilePic">
                    <button id="editProfileBtn" class="text-blue-500 text-xl"><ion-icon name="create-outline"></ion-icon></button>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700">Username</label>
                    <input type="text" id="username" class="w-full p-2 border rounded-lg" disabled>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700">Adresse</label>
                    <input type="text" id="address" class="w-full p-2 border rounded-lg" disabled>
                </div>
            </div>
            <button id="saveProfileBtn" class="hidden mt-5 w-full bg-green-500 text-white font-bold p-3 rounded-lg">Sauvegarder</button>
            <button onclick="document.getElementById('profileModal').classList.add('hidden')" class="mt-5 w-full text-gray-500">Fermer</button>
        </div>
    </div>

    

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <!-- Suppression de la dépendance script globale inutile -->
    <script type="module" src="supabase.js"></script>
    <script type="module" src="script.js"></script>

</body>
</html>
